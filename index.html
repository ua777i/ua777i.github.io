<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация по сервисам</title>
    <style>
        /* Подключаем шрифт */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        /* Сбрасываем стандартные отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Основной фон и шрифт */
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #ffffff;
            overflow: hidden; /* Убираем прокрутку, если контент помещается */
            position: relative;
        }

        /* Декоративные плавающие круги на фоне (для красоты) */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: #ff00cc;
            top: -150px;
            left: -150px;
            animation: float 8s infinite ease-in-out;
        }

        .shape-2 {
            width: 350px;
            height: 350px;
            background: #00e0ff;
            bottom: -100px;
            right: -100px;
            animation: float 10s infinite ease-in-out reverse;
        }

        .shape-3 {
            width: 250px;
            height: 250px;
            background: #7000ff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float 12s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Контейнер для карточек */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        /* Стиль карточек (Glassmorphism) */
        .card {
            width: 280px;
            height: 340px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.4s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Эффект при наведении на карточку */
        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Иконки внутри карточек */
        .card-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.1);
        }

        /* Заголовок карточки */
        .card-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* Подзаголовок / описание */
        .card-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 0 20px;
            transition: color 0.3s ease;
        }

        .card:hover .card-desc {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Декоративная линия-подчеркивание снизу */
        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .card:hover::after {
            transform: translateX(100%);
        }

        /* Специфичные цвета для границ при наведении */
        .card.circles:hover {
            box-shadow: 0 0 30px rgba(0, 224, 255, 0.3), 0 15px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(0, 224, 255, 0.5);
        }
        
        .card.tracks:hover {
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3), 0 15px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 0, 204, 0.5);
        }

        /* Адаптивность для телефонов */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 20px;
                margin-top: 20px;
                margin-bottom: 20px;
            }
            
            body {
                overflow-y: auto; /* Разрешаем прокрутку на мобильных */
                align-items: flex-start;
                padding-top: 40px;
            }

            .card {
                width: 100%;
                max-width: 320px;
                height: 260px;
            }

            .card-icon {
                font-size: 3rem;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Декоративные фоновые круги -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <main class="container">
        
        <!-- Карточка 1: Circles -->
        <a href="circles.html" class="card circles">
            <div class="card-icon">◯</div>
            <h2 class="card-title">Circles</h2>
            <p class="card-desc">Перейти к сервису Circles</p>
        </a>

        <!-- Карточка 2: Tracks -->
        <a href="tracks.html" class="card tracks">
            <div class="card-icon">〰</div>
            <h2 class="card-title">Tracks</h2>
            <p class="card-desc">Перейти к сервису Tracks</p>
        </a>

    </main>

</body>
</html>
